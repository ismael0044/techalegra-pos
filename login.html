<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechAlegra POS - Acceso y Registro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Luces de Fondo -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-2xl shadow-2xl relative">
            
            <!-- Encabezado con Isotipo -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl shadow-lg shadow-blue-500/30 mb-3">
                    <i class="fa-solid fa-cash-register text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">TechAlegra POS</h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-semibold" id="subtitleText">Sistema de Facturación & Inventario</p>
            </div>

            <!-- Selector de Modos (Tabs) -->
            <div class="flex bg-slate-800/60 p-1 rounded-xl mb-6 border border-slate-700/50">
                <button type="button" id="tabLogin" class="flex-1 py-2 text-xs font-semibold text-white bg-blue-600 rounded-lg shadow transition-all">
                    Iniciar Sesión
                </button>
                <button type="button" id="tabRegister" class="flex-1 py-2 text-xs font-semibold text-slate-400 hover:text-white rounded-lg transition-all">
                    Crear Cuenta
                </button>
            </div>

            <!-- ================= FORMULARIO LOGIN ================= -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-user"></i>
                        </div>
                        <input type="text" id="loginUsuario" required placeholder="Ingrese su usuario"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="loginPassword" required placeholder="••••••••"
                            class="w-full pl-10 pr-10 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                    </div>
                </div>

                <div id="loginAlert" class="hidden flex items-center gap-2 p-3 text-xs rounded-xl border"></div>

                <button type="submit" id="btnLoginSubmit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-blue-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <span>Entrar al Sistema</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- ================= FORMULARIO REGISTRO ================= -->
            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Nombre Completo</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-id-card"></i>
                        </div>
                        <input type="text" id="regNombre" required placeholder="Ej. Juan Pérez"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Nombre de Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-user"></i>
                        </div>
                        <input type="text" id="regUsuario" required placeholder="Ej. juanperez"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="regPassword" required placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Rol en el Sistema</label>
                    <select id="regRol" class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500">
                        <option value="cajero">Cajero / Vendedor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div id="registerAlert" class="hidden flex items-center gap-2 p-3 text-xs rounded-xl border"></div>

                <button type="submit" id="btnRegisterSubmit" 
                    class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-emerald-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <span>Crear Mi Cuenta</span>
                    <i class="fa-solid fa-user-plus text-xs"></i>
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-800/80 text-center">
                <p class="text-xs text-slate-500">&copy; 2026 TechAlegra POS. Sistema Comercial.</p>
            </div>

        </div>
    </div>

    <script>
        // Lógica de Pestañas (Tabs)
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        tabLogin.addEventListener('click', () => {
            tabLogin.className = "flex-1 py-2 text-xs font-semibold text-white bg-blue-600 rounded-lg shadow transition-all";
            tabRegister.className = "flex-1 py-2 text-xs font-semibold text-slate-400 hover:text-white rounded-lg transition-all";
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.className = "flex-1 py-2 text-xs font-semibold text-white bg-emerald-600 rounded-lg shadow transition-all";
            tabLogin.className = "flex-1 py-2 text-xs font-semibold text-slate-400 hover:text-white rounded-lg transition-all";
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // Helper para mostrar alertas
        function showAlert(divId, message, isSuccess) {
            const div = document.getElementById(divId);
            div.classList.remove('hidden', 'text-red-400', 'bg-red-950/50', 'border-red-800/50', 'text-emerald-400', 'bg-emerald-950/50', 'border-emerald-800/50');
            
            if (isSuccess) {
                div.classList.add('text-emerald-400', 'bg-emerald-950/50', 'border-emerald-800/50');
                div.innerHTML = `<i class="fa-solid fa-circle-check text-sm shrink-0"></i> <span>${message}</span>`;
            } else {
                div.classList.add('text-red-400', 'bg-red-950/50', 'border-red-800/50');
                div.innerHTML = `<i class="fa-solid fa-circle-exclamation text-sm shrink-0"></i> <span>${message}</span>`;
            }
        }

        // Petición: Iniciar Sesión
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('loginUsuario').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert('loginAlert', '¡Acceso concedido! Redirigiendo...', true);
                    setTimeout(() => { window.location.href = '/index.html'; }, 800);
                } else {
                    showAlert('loginAlert', data.message || 'Error de autenticación', false);
                }
            } catch (err) {
                showAlert('loginAlert', 'Error de conexión con el servidor', false);
            }
        });

        // Petición: Registrarse
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('regNombre').value;
            const usuario = document.getElementById('regUsuario').value;
            const password = document.getElementById('regPassword').value;
            const rol = document.getElementById('regRol').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, usuario, password, rol })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert('registerAlert', data.message, true);
                    setTimeout(() => {
                        registerForm.reset();
                        tabLogin.click(); // Cambiar automáticamente al login
                    }, 1500);
                } else {
                    showAlert('registerAlert', data.message || 'Error al registrar', false);
                }
            } catch (err) {
                showAlert('registerAlert', 'Error de conexión con el servidor', false);
            }
        });
    </script>
</body>
</html>
