<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechAlegra POS - Acceso al Sistema</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Íconos Profesionales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Inter de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Elementos Decorativos de Fondo -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Tarjeta Principal de Login -->
    <div class="w-full max-w-md relative z-10">
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-2xl shadow-2xl relative">
            
            <!-- Encabezado con Isotipo/Logotipo -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl shadow-lg shadow-blue-500/30 mb-3">
                    <i class="fa-solid fa-cash-register text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">TechAlegra POS</h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-semibold">Sistema de Facturación & Inventario</p>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form id="loginForm" class="space-y-5">
                
                <!-- Campo: Usuario -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-user"></i>
                        </div>
                        <input type="text" id="usuario" required placeholder="Ingrese su usuario"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                    </div>
                </div>

                <!-- Campo: Contraseña -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full pl-10 pr-10 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                        
                        <!-- Botón Ver Contraseña -->
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors">
                            <i class="fa-regular fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Mensaje de Error Alerta -->
                <div id="errorMessage" class="hidden flex items-center gap-2 p-3 text-xs text-red-400 bg-red-950/50 border border-red-800/50 rounded-xl">
                    <i class="fa-solid fa-circle-exclamation text-sm shrink-0"></i>
                    <span id="errorText">Credenciales incorrectas</span>
                </div>

                <!-- Botón de Entrar -->
                <button type="submit" id="btnSubmit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-blue-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <span>Entrar al Sistema</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Pie de Tarjeta -->
            <div class="mt-8 pt-4 border-t border-slate-800/80 text-center">
                <p class="text-xs text-slate-500">
                    &copy; 2026 <span class="font-medium text-slate-400">TechAlegra POS</span>. Todos los derechos reservados.
                </p>
            </div>

        </div>
    </div>

    <!-- Script de Autenticación y UI -->
    <script>
        // Funcionalidad para mostrar/ocultar contraseña
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        // Manejador del Formulario
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const password = passwordInput.value;
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const btnSubmit = document.getElementById('btnSubmit');

            errorDiv.classList.add('hidden');
            
            // Estado de carga en el botón
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin text-sm"></i> <span>Verificando...</span>`;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    btnSubmit.classList.remove('from-blue-600', 'to-indigo-600');
                    btnSubmit.classList.add('from-emerald-600', 'to-teal-600');
                    btnSubmit.innerHTML = `<i class="fa-solid fa-check text-sm"></i> <span>¡Acceso Correcto!</span>`;
                    
                    setTimeout(() => {
                        window.location.href = '/index.html'; 
                    }, 800);
                } else {
                    errorText.textContent = data.message || 'Usuario o contraseña incorrectos';
                    errorDiv.classList.remove('hidden');
                    resetButton();
                }
            } catch (err) {
                errorText.textContent = 'No se pudo conectar con el servidor';
                errorDiv.classList.remove('hidden');
                resetButton();
            }
        });

        function resetButton() {
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<span>Entrar al Sistema</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        }
    </script>
</body>
</html>
